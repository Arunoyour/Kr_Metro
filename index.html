<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Transit Route Finder</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d3fd8" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kr Metro" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1>Transit Route Finder</h1>
      <p>Choose a city, then a service.</p>
    </header>

    <main class="picker-main">
      <section class="card" id="city-step">
        <h2 class="step-heading">Choose a city</h2>
        <div class="tile-grid" id="city-grid">
          <p class="empty-state">Loading cities…</p>
        </div>
      </section>

      <section class="card" id="service-step" hidden>
        <button type="button" class="back-link" id="back-to-cities">&larr; Choose a different city</button>
        <h2 class="step-heading" id="service-step-heading">Choose a service</h2>
        <div class="tile-grid" id="service-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      More cities and services are added as data becomes available.
    </footer>
  </div>

  <script src="landing.js"></script>
</body>
</html>
